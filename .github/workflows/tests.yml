name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.11"
          - os: macos-14
            python: "3.12"
          - os: macos-14
            python: "3.14"
          - os: ubuntu-22.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install media tools on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check yt-dlp
      - name: Install media tools on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg yt-dlp
      - name: Install media tools on Windows
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y --no-progress
          python -m pip install --disable-pip-version-check yt-dlp
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q skills tools tests
      - name: Validate execution registry
        run: python tools/validate_v1_execution.py
