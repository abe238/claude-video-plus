name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install release verification dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify release tag and repository
        run: |
          VERSION="$(python -c 'import re; from pathlib import Path; text = Path("skills/watch/SKILL.md").read_text(encoding="utf-8"); print(re.search(r"^\s*version:\s*(\S+)", text, re.MULTILINE).group(1).strip(chr(34)+chr(39)))')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          python -m pytest -q
          python -m compileall -q skills tools tests
          python tools/validate_v1_execution.py

      - name: Build .skill artifact
        run: |
          bash skills/watch/scripts/build-skill.sh
          test -f dist/watch.skill

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: dist/watch.skill
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
