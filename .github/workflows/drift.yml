name: Drift canary

# Weekly early-warning for yt-dlp / YouTube breakage. yt-dlp ships ~weekly and
# YouTube changes its player often. This canary installs the LATEST yt-dlp on a
# schedule and (a) runs the suite against it (code-level integration) and (b)
# does a YouTube METADATA-extraction smoke — which exercises the extractor + nsig
# challenge (the most common break) without a media download.
#
# Why metadata, not a media download: YouTube bot-walls datacenter IPs ("Sign in
# to confirm you're not a bot"), so a real media download from GitHub's runners
# ALWAYS fails regardless of product health — it would cry-wolf every week. A
# bot-wall is therefore treated as a SKIP, not a failure; only a genuine
# extractor error fails the run. The pure media-403 break (v1.5.9: metadata
# works, media 403s) is inherently untestable from a datacenter IP and is instead
# covered at runtime by the yt-dlp self-heal on the user's own machine.
#
# A red run emails the owner BEFORE a user hits it.
#
# Schedule/dispatch ONLY — never push/pull_request, so upstream PyPI movement can
# never gate a PR merge (a canary, not a required check). fork-watch:
# androsland/moviola.

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install media tools (LATEST yt-dlp, unpinned on purpose)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pytest "yt-dlp[default]"
          echo "yt-dlp $(yt-dlp --version)"
      - name: Suite against latest yt-dlp (code-level integration)
        run: python -m pytest -q
      - name: YouTube extraction smoke (metadata — catches extractor/nsig breaks)
        run: |
          URL="https://www.youtube.com/watch?v=WZyRbnpGyzQ"   # JFK Rice, public, long-lived
          for attempt in 1 2; do
            if yt-dlp --no-warnings -J "$URL" >/dev/null 2>err.txt; then
              echo "metadata extraction OK on yt-dlp $(yt-dlp --version)"
              exit 0
            fi
            if grep -qiE "confirm you.?re not a bot|sign in to confirm" err.txt; then
              echo "::warning::YouTube bot-walled the CI datacenter IP — extraction not verifiable here; skipping (not a product break)."
              exit 0
            fi
            echo "extraction attempt $attempt failed (not a bot-wall); retrying" >&2
            sleep 15
          done
          cat err.txt >&2
          echo "::error::yt-dlp YouTube metadata extraction failed on latest yt-dlp — likely an extractor/nsig break; patch the acquisition path." >&2
          exit 1
